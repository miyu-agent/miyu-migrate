[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 跟 miyu-migrate/package.toml 的版本走（施工 MG-16）：报告的 `migrate`、会话包里的 `miyu-migrate <版本>` 读的是它，
# 发版改清单版本时这里一起改；`version_matches_the_package_manifest` 守着两边一样。
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
zstd = "0.14"
walkdir = "2.5"
jiff = "0.2"
tempfile = "3.27"
# 旧版 scope、会话编号里的哈希（旧版用的就是 blake3）。
blake3 = "1.8"
# 一问一答连核心：门面的 `open::Core` 是异步的，迁移程序自己带一个单线程的运行时。
tokio = { version = "1", features = ["rt"] }
# 打包前看状态目录那块盘还剩多少（三个平台）。
fs4 = "0.13"
# 新核心：连核心的门面，钉在一个提交上，核心改了格式跟着它的版本重编（细则第十四节）。
miyu-client = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
# 事件、编号（Event::from_line 读一遍再写）；会话日志、blob 库、原始包（细则第十四节：清单、包都照核心的写法）。
miyu-kernel = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
# 读旧会话库：SQLite，同核心一样自己带源码编（三个平台一样）。
rusqlite = { version = "0.40", features = ["bundled"] }
# 旧附件的图片认大小（图片块要宽高）。
imagesize = "0.14"
# 测试里在进程里起真核心（照 miyu-im 测试的起法），同一个提交。
miyu-endpoint = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
# 测试里的核心照真核心起来时那样拼配置清单（包声明的项：供应商、模型、搜索……），同 miyu-im 的测试；搜索的项在 `net` 里。
miyu-core = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f", default-features = false, features = ["net"] }
miyu-session = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
miyu-ipc = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
miyu-store = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }
miyu-tool = { git = "https://github.com/miyu-agent/miyu", rev = "65b0c2188bdc2b9f6d3bd9146acdd649efc05c2f" }

# 同核心（核心仓库根目录的 Cargo.toml，理由见核心的施工单 0-1「我定的」）。
[workspace.lints.rust]
unsafe_code = "forbid"
# 不吞错误：必须处理的返回值不许不理。
unused_must_use = "deny"
# 公开的东西都要有文档注释。
missing_docs = "warn"

[workspace.lints.clippy]
# 不吞错误：不许用 `let _ =` 或 `.ok()` 把错误悄悄扔掉。真要扔，写 #[expect(..., reason = "...")]。
let_underscore_must_use = "deny"
unused_result_ok = "deny"
# 读到坏数据要报错，不能直接崩。测试里允许，见 clippy.toml。
unwrap_used = "deny"
# 会出错的函数写 # Errors，会 panic 的写 # Panics。
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
